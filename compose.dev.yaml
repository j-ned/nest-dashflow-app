services:
  db:
    image: postgres:18
    container_name: dashflow-db-dev
    restart: unless-stopped
    env_file: .env.podman
    ports:
      - "5432:5432"
    volumes:
      - dashflow_pgdata:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - ${HOME}/backups/dashflow:/dumps:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dashflow_pgdata:
